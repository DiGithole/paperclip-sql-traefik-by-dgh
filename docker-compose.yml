services:
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--entrypoints.web.address=:80"
    ports:
      - "8000:80"
    volumes:
      - "./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml"
    networks:
      - paperclip-network

  paperclip_db:
    image: postgres:15-alpine
    container_name: paperclip_db
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: db
      POSTGRES_DB: paperclip
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paperclip-network

  paperclip_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: paperclip_app
    environment:
      PAPERCLIP_DATABASE_URL: postgres://paperclip:db@paperclip_db:5432/paperclip
      PAPERCLIP_AUTH_SECRET: ${SECRET}
      PAPERCLIP_AUTH_BASE_URL: http://${DOMAIN}:8000
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: postgres://paperclip:db@paperclip_db:5432/paperclip
      BETTER_AUTH_SECRET: ${SECRET}
      BETTER_AUTH_URL: http://${DOMAIN}:8000
      PORT: 3105
    volumes:
      - ./data/paperclip:/paperclip
    depends_on:
      paperclip_db:
        condition: service_healthy
    networks:
      - paperclip-network

networks:
  paperclip-network:
    driver: bridge
