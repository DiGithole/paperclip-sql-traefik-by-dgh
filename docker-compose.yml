services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "./data/traefik:/letsencrypt"
      - "./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro"
    restart: always

  db:
    image: postgres:15-alpine
    container_name: paperclip_db
    restart: always
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip_password
      POSTGRES_DB: paperclip
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 5

  paperclip:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: paperclip_app
    restart: always
    environment:
      - DATABASE_URL=postgres://paperclip:paperclip_password@db:5432/paperclip
      - BETTER_AUTH_SECRET=${SECRET:-paperclip-dev-secret}
      - BETTER_AUTH_URL=http://${DOMAIN}
      - BETTER_AUTH_BASE_URL=http://${DOMAIN}
      - PAPERCLIP_AGENT_JWT_SECRET=${SECRET:-paperclip-dev-secret}
      - SERVE_UI=true
      - PORT=3100
    volumes:
      - ./data/paperclip:/paperclip
    depends_on:
      db:
        condition: service_healthy

