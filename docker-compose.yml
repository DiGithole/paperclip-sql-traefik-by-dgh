services:
  paperclip_db:
    image: postgres:16-alpine
    container_name: paperclip_db
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: db
      POSTGRES_DB: paperclip
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 3s
      timeout: 3s
      retries: 10

  paperclip_app:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip_app
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:db@paperclip_db:5432/paperclip
      PAPERCLIP_DATABASE_URL: postgres://paperclip:db@paperclip_db:5432/paperclip
      BETTER_AUTH_SECRET: paperclip-very-secure-random-secret-32-chars-long
      PAPERCLIP_AGENT_JWT_SECRET: paperclip-very-secure-random-secret-32-chars-long
      PORT: 3100
      PAPERCLIP_SERVER_PORT: 3100
      PAPERCLIP_SERVER_HOST: 0.0.0.0
      BETTER_AUTH_URL: http://localhost:3100
      PAPERCLIP_HOME: /paperclip
    volumes:
      - ./data/paperclip:/paperclip
    depends_on:
      paperclip_db:
        condition: service_healthy
